name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests examples benchmarks
      - run: mypy src/runtime_sentinel
      - run: pytest --cov-report=xml
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if tag[1:] != version:
              raise SystemExit(f"tag {tag} does not match project version {version}")
          PY
      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
